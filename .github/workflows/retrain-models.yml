name: Model Retraining Pipeline

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version label"
        required: true
        default: "v2"

  push:
    branches:
      - bits

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      MODEL_VERSION: ${{ github.event.inputs.model_version || format('bits-build-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain models
        run: python training/train_all.py
